# RW config for the two_bluefox.launch.py rig (left/right bluefox cameras).
#
# Topic layout: detector/tracker/pose_estimator/filter are each launched
# standalone (detector.launch.py etc.) with their `namespace` defaulting to
# $UAV_NAME (see hw_api.launch.py's pattern). single_bluefox.launch.py
# namespaces each camera as $UAV_NAME/left and $UAV_NAME/right. Because both
# sides resolve under the same $UAV_NAME, the camera inputs below can stay
# *relative* ("left/image_raw") and still land on exactly what the camera
# publishes ($UAV_NAME/left/image_raw) -- no hardcoded uav name needed. Every
# other topic here is entirely internal to uvdar_core and is relative for the
# same reason (namespace push, matching mrs_uav_hw_api's convention).
detector:
  debug: false
  gui: false
  initial_delay_sec: 0.0
  queue_depth: 10
  thread_pool_size: 3
  max_points_per_image: 100
  inputs:
    - name: left
      input_topic: left/bluefox_left/image_raw
      output_topic: detector/left/points_seen
      detect_sun_points: true
      publish_sun_points: true
      sun_output_topic: detector/left/points_seen/sun
      publish_visualization: true
      visualization_topic: detector/left/detection_visualization
      mask_file: ""
      backend: gpu
      threshold: 120
      threshold_diff: 60
      threshold_sun: 240
      min_sun_marker_distance: 20
      max_markers_count: 300
      max_sun_points_count: 72000
      radii: [3, 5]
    - name: right
      input_topic: right/bluefox_right/image_raw
      output_topic: detector/right/points_seen
      detect_sun_points: true
      publish_sun_points: true
      sun_output_topic: detector/right/points_seen/sun
      publish_visualization: true
      visualization_topic: detector/right/detection_visualization
      mask_file: ""
      backend: gpu
      threshold: 120
      threshold_diff: 60
      threshold_sun: 240
      min_sun_marker_distance: 20
      max_markers_count: 300
      max_sun_points_count: 72000
      radii: [3, 5]

tracking:
  # Select "ami" for the AMI tracker or "generalized" for covariance-aware tracking.
  implementation: ami
  debug: false
  gui: false
  initial_delay_sec: 0.0
  queue_depth: 10
  thread_pool_size: 2
  max_points_per_image: 100
  max_px_shift_x: 3
  max_px_shift_y: 3
  max_zeros_consecutive: 10
  stored_seq_len_factor: 20
  max_buffer_length: 5000
  poly_order: 4
  decay_factor: 0.1
  confidence_probability: 95.0
  # Generalized tracker only: Mahalanobis gate width in standard deviations.
  association_gate_sigma: 3.0
  # Generalized tracker only: fallback variance for invalid or missing detector covariance.
  default_measurement_variance: 1.0
  # Generalized tracker only: isotropic per-frame prediction noise added in px^2.
  process_noise_variance: 1.0
  allowed_BER_per_seq: 0
  manchester_code: false
  # If set, sequence_file replaces the inline library below. All loaded
  # sequences must be non-empty and have equal length.
  sequence_file: "./selected.txt"
  sequences:
    - "111001011"
    - "110011010"
    - "101100111"
    - "100111010"
  inputs:
    - name: left
      input_topic: detector/left/points_seen
      input_image_topic: left/image_raw
      output_topic: tracker/left/blinkers
      publish_visualization: true
      visualization_topic: tracker/left/visualization
    - name: right
      input_topic: detector/right/points_seen
      input_image_topic: right/image_raw
      output_topic: tracker/right/blinkers
      publish_visualization: true
      visualization_topic: tracker/right/visualization

pose_estimation:
  # Select "particle_filter" for stochastic hypothesis filtering or
  # "geometric_solver" for direct P2P/P3P/P4P/PnP pose estimation.
  implementation: particle_filter
  debug: false
  # "local_origin" doesn't exist in the ROS2 MRS TF tree (ROS1 naming) --
  # this is the observing robot's own body frame, uav_name/fcu. Hardcoded to
  # uav1 for the same reason as camera_frame below; update per deployment.
  output_frame: uav1/fcu
  output_topic: pose_estimator/measured_poses
  publish_constituents: false
  model_file: models/quadrotor.txt
  signal_ids: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  # Used by non-filtered implementations that do not own a natural scatter step.
  publish_period_sec: 0.1
  particle_filter:
    separate_by_distance: true
    max_cluster_distance: 100.0
    scatter_time_step: 0.1
    mutation_position_max_step: 1.0
    mutation_orientation_max_step: 1.0
    mutation_velocity_max_step: 1.0
    max_hypothesis_count: 1000
    max_hypothesis_age: 1.5
    edge_detection_margin: 10
    initial_rough_hypothesis_count: 200
    initial_hypothesis_count: 10
    max_init_iterations: 10000
    max_mutation_refine_iterations: 1000
  geometric_solver:
    p4p_reprojection_threshold_rad: 0.01
    covariance_regularization_px: 1.0e-6
    refinement_iterations: 8
    pnp_max_iterations: 40
    pnp_damping: 1.0e-8
    pnp_finite_difference_eps: 1.0e-6
    pnp_step_tolerance: 1.0e-10
    pnp_residual_tolerance: 1.0e-10
  # camera_frame is a TF frame name, not a topic -- it's not namespace-pushed,
  # so it must be the fully-qualified frame single_bluefox.launch.py actually
  # publishes: $UAV_NAME/bluefox_<camera_name> (see its frame_id construction).
  # Hardcoded to uav1 here for the same reason the two_drones_uvdar sim
  # configs hardcode TF frames -- update if UAV_NAME differs.
  #
  # calib_file points at the generic ocam.yaml; per-device calibrations exist
  # at camera/bluefox_ocam_calib/bf_uv_25001879.yaml and bf_uv_25001954.yaml
  # -- swap in whichever matches BLUEFOX_LEFT_ID/BLUEFOX_RIGHT_ID once you
  # know which serial is mounted on which side.
  inputs:
    - name: left
      input_topic: tracker/left/blinkers
      camera_frame: uav1/bluefox_left
      calib_file: camera/bluefox_ocam_calib/bf_left.yaml
    - name: right
      input_topic: tracker/right/blinkers
      camera_frame: uav1/bluefox_right
      calib_file: camera/bluefox_ocam_calib/bf_right.yaml

filtering:
  implementation: kf_pose
  debug: false
  # World-fixed frame (ROS2 MRS's equivalent of ROS1's "local_origin");
  # hardcoded to uav1 for the same reason as camera_frame above.
  output_frame: uav1/fixed_origin
  measured_poses_topics: [pose_estimator/measured_poses]
  output_topic: filter/filtered_poses
  tentative_output_topic: filter/filtered_poses/tentative
  output_framerate: 20.0
  anonymous_measurements: false
  indoor: false
  odometry_available: true
  use_velocity: false
  min_measurements_to_validation: 10
  decay_age_normal: 3.0
  decay_age_unvalidated: 1.0
  match_level_threshold_associate: 0.3
  match_level_threshold_remove: 0.5


calibration:
  enabled: false
  implementation: none

simulation:
  enabled: false
  implementation: none
