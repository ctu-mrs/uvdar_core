# RW config for the two_bluefox.launch.py rig (left/right bluefox cameras).
#
# Topic layout: detector/tracker/pose_estimator/filter are each launched
# standalone (detector.launch.py etc.) with their `namespace` defaulting to
# $UAV_NAME (see hw_api.launch.py's pattern). single_bluefox.launch.py
# namespaces each camera as $UAV_NAME/left and $UAV_NAME/right. Because both
# sides resolve under the same $UAV_NAME, the camera inputs below can stay
# *relative* ("left/image_raw") and still land on exactly what the camera
# publishes ($UAV_NAME/left/image_raw) -- no hardcoded uav name needed. Every
# other topic here is entirely internal to uvdar_core and is relative for the
# same reason (namespace push, matching mrs_uav_hw_api's convention).
detector:
  debug: false
  gui: false
  initial_delay_sec: 0.0
  queue_depth: 10
  thread_pool_size: 3
  max_points_per_image: 100
  inputs:
    - name: left
      input_topic: left/bluefox/image_raw
      output_topic: uvdar/left/detector/points_seen
      detect_sun_points: false
      publish_sun_points: false
      sun_output_topic: uvdar/left/detector/points_seen/sun
      publish_visualization: false
      visualization_topic: uvdar/left/detector/detection_visualization
      mask_file: ""
      backend: cpu
      threshold: 140
      threshold_diff: 60
      threshold_sun: 240
      min_sun_marker_distance: 20
      max_markers_count: 300
      max_sun_points_count: 72000
      radii: [3, 5]
    - name: right
      input_topic: right/bluefox/image_raw
      output_topic: uvdar/right/detector/points_seen
      detect_sun_points: false
      publish_sun_points: false
      sun_output_topic: uvdar/right/detector/points_seen/sun
      publish_visualization: false
      visualization_topic: uvdar/right/detector/detection_visualization
      mask_file: ""
      backend: cpu
      threshold: 140
      threshold_diff: 60
      threshold_sun: 240
      min_sun_marker_distance: 20
      max_markers_count: 300
      max_sun_points_count: 72000
      radii: [3, 5]

tracking:
  # Select "ami" for the AMI tracker or "generalized" for covariance-aware tracking.
  implementation: generalized
  debug: false
  gui: false
  initial_delay_sec: 0.0
  queue_depth: 10
  thread_pool_size: 2
  max_points_per_image: 100
  max_px_shift_x: 3
  max_px_shift_y: 3
  max_zeros_consecutive: 10
  stored_seq_len_factor: 5
  max_buffer_length: 5000
  poly_order: 4
  decay_factor: 0.1
  confidence_probability: 95.0
  # Generalized tracker only: Mahalanobis gate width in standard deviations.
  association_gate_sigma: 3.0
  # Generalized tracker only: fallback variance for invalid or missing detector covariance.
  default_measurement_variance: 1.0
  # Generalized tracker only: isotropic per-frame prediction noise added in px^2.
  process_noise_variance: 1.0
  allowed_BER_per_seq: 1
  manchester_code: false
  # If set, sequence_file replaces the inline library below. All loaded
  # sequences must be non-empty and have equal length.
  sequence_file: "./selected.txt"
  sequences:
    - "0011101101"
    - "0010110101"
    - "0101010111"
    - "0010011011"
    - "0001100111"
  inputs:
    - name: left
      input_topic: uvdar/left/detector/points_seen
      input_image_topic: left/bluefox/image_raw
      output_topic: uvdar/left/tracker/blinkers
      publish_visualization: false
      visualization_topic: uvdar/left/tracker/visualization
    - name: right
      input_topic: uvdar/right/detector/points_seen
      input_image_topic: right/bluefox/image_raw
      output_topic: uvdar/right/tracker/blinkers
      publish_visualization: false
      visualization_topic: uvdar/right/tracker/visualization

pose_estimation:
  # Select "particle_filter" for stochastic hypothesis filtering or
  # "geometric_solver" for direct visibility/P3P/P4P/PnP pose estimation.
  implementation: geometric_solver 
  debug: false
  # $UAV_NAME is expanded from the process environment while loading YAML.
  # The launch namespace does not modify TF frame IDs.
  output_frame: $UAV_NAME/fcu
  output_topic: uvdar/pose_estimator/measured_poses
  publish_visualization: false
  visualization_topic: uvdar/pose_estimator/visualization
  publish_constituents: false
  model_file: models/quadrotor_foursided_px4_motor_aligned_charlotte.txt
  signal_ids: [0, 1, 2, 3]
  # Used by non-filtered implementations that do not own a natural scatter step.
  publish_period_sec: 0.025
  particle_filter:
    separate_by_distance: true
    max_cluster_distance: 100.0
    scatter_time_step: 0.1
    mutation_position_max_step: 1.0
    mutation_orientation_max_step: 1.0
    mutation_velocity_max_step: 1.0
    max_hypothesis_count: 1000
    max_hypothesis_age: 1.5
    edge_detection_margin: 10
    initial_rough_hypothesis_count: 200
    initial_hypothesis_count: 10
    max_init_iterations: 10000
    max_mutation_refine_iterations: 1000
  geometric_solver:
    uncertainty_solver: ellipse_transform # Options: jacobian_propagation, monte_carlo, ellipse_transform
    uncertainty_samples: 5000
    visibility_half_angle_rad: 1.5707963267948966
    visibility_minimum_bearing_separation_rad: 0.0001
    visibility_mode_gap_rad: 0.7853981633974483
    visibility_depth_quadrature_order: 64
    visibility_spin_quadrature_order: 12
    p4p_reprojection_threshold_rad: 0.01
    covariance_regularization_px: 1.0e-6
    refinement_iterations: 4
    pnp_max_iterations: 40
    pnp_damping: 1.0e-8
    pnp_finite_difference_eps: 1.0e-6
    pnp_step_tolerance: 1.0e-10
    pnp_residual_tolerance: 1.0e-10
    # Set true to combine the last observations within the synchronization
    # tolerance using the known camera TFs.
    multi_cam_rig_enable: true
    multi_cam_sync_tolerance_sec: 0.03
    multi_cam_min_cameras: 2
    multi_cam_max_angular_error_rad: 0.05
    multi_cam_refinement_iterations: 40
    multi_cam_damping: 1.0e-8
    multi_cam_step_tolerance: 1.0e-10
    multi_cam_residual_tolerance: 1.0e-10
    multi_cam_gp3p_depth_seed_levels: 7
    multi_cam_gp3p_depth_iterations: 60
    multi_cam_gp3p_root_tolerance: 1.0e-9
  # camera_frame is a TF frame name, not a topic -- it's not namespace-pushed,
  # so it must match the fully-qualified frame published by
  # single_bluefox.launch.py: $UAV_NAME/bluefox_<camera_name>.
  #
  # Select each device-specific calibration according to the serial mounted on
  # the corresponding side of the vehicle.
  inputs:
    - name: left
      input_topic: uvdar/left/tracker/blinkers
      camera_frame: $UAV_NAME/bluefox_left
      calib_file: camera/bluefox_ocam_calib/bf_left.yaml
    - name: right
      input_topic: uvdar/right/tracker/blinkers
      camera_frame: $UAV_NAME/bluefox_right
      #=======
      #      input_topic: uvdar/left/tracker/blinkers
      #      camera_frame: bluefox_left
      #      calib_file: camera/bluefox_ocam_calib/bf_left.yaml
      #    - name: right
      #      input_topic: uvdar/right/tracker/blinkers
      #      camera_frame: bluefox_right
      calib_file: camera/bluefox_ocam_calib/bf_right.yaml

filtering:
  implementation: kf_pose
  debug: false
  # World-fixed TF frame; $UAV_NAME is expanded by the YAML loader.
  output_frame: $UAV_NAME/fixed_origin
  measured_poses_topics: [uvdar/pose_estimator/measured_poses]
  output_topic: uvdar/filter/filtered_poses
  tentative_output_topic: uvdar/filter/filtered_poses/tentative
  output_framerate: 0.0
  anonymous_measurements: false
  indoor: false
  use_velocity: false
  process_acceleration_std_horizontal: 1.0
  process_acceleration_std_vertical: 0.5
  process_angular_velocity_std: 0.35
  initial_velocity_std: 1.0
  min_measurements_to_validation: 10
  decay_age_normal: 3.0
  decay_age_unvalidated: 1.0
  match_level_threshold_associate: 0.3
  match_level_threshold_remove: 0.5


calibration:
  enabled: false
  implementation: none

simulation:
  enabled: false
  implementation: none
