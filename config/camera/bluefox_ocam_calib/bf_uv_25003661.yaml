# OCamCalib camera model.
#
# Polynomial coefficients use ascending powers of the radial variable:
#   direct_polynomial maps image radius -> camera z for cam2world/backProject.
#   inverse_polynomial maps elevation angle -> image radius for world2cam/project.
# center is [row, column] in the OCamCalib convention, starting from zero.
# affine is [c, d, e] from the OCamCalib affine matrix.
# image_size is [height, width].
calibration_model: ocamcalib
direct_polynomial: [-278.9728, 0.0, 0.001522563, -0.000002316075, 0.000000006650527]
inverse_polynomial: [407.225485, 216.123686, -17.239062, 36.745918, 19.920345, 41.224629, 113.968605, 110.479784, 45.591471, 6.952345]
center: [225.203339, 374.613561]
affine: [0.999842, -0.000055, -0.000240]
image_size: [480, 752]
