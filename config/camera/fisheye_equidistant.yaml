# OpenCV fisheye/equidistant camera model.
#
# intrinsics is [fx, fy, cx, cy].
# distortion is [k1, k2, k3, k4] for theta_d = theta*(1+k1*t^2+...+k4*t^8).
# Replace the example values with a real calibration before use.
calibration_model: fisheye_equidistant
intrinsics: [500.0, 500.0, 376.0, 240.0]
distortion: [0.0, 0.0, 0.0, 0.0]
image_width: 752
image_height: 480
