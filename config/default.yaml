detector:
  debug: false
  gui: false
  initial_delay_sec: 0.0
  queue_depth: 10
  thread_pool_size: 3
  max_points_per_image: 100
  inputs:
    - name: camera_0
      input_topic: /my_camera/pylon_ros2_camera_node/image_raw
      output_topic: /detector/camera_0/points_seen
      detect_sun_points: true
      publish_sun_points: true
      sun_output_topic: /detector/camera_0/points_seen/sun
      publish_visualization: true
      visualization_topic: /detector/camera_0/detection_visualization
      mask_file: ""
      backend: gpu
      threshold: 120
      threshold_diff: 60
      threshold_sun: 240
      min_sun_marker_distance: 20
      max_markers_count: 300
      max_sun_points_count: 72000
      radii: [3, 5]

tracking:
  # Select "ami" for the legacy tracker or "generalized" for covariance-aware tracking.
  implementation: ami
  debug: false
  gui: false
  initial_delay_sec: 0.0
  queue_depth: 10
  thread_pool_size: 2
  max_points_per_image: 100
  max_px_shift_x: 5
  max_px_shift_y: 5
  max_zeros_consecutive: 3
  stored_seq_len_factor: 3
  max_buffer_length: 2000
  poly_order: 3
  decay_factor: 0.01
  conf_probab_percent: 95.0
  # Generalized tracker only: Mahalanobis gate width in standard deviations.
  association_gate_sigma: 3.0
  # Generalized tracker only: fallback variance for invalid or missing detector covariance.
  default_measurement_variance: 1.0
  # Generalized tracker only: isotropic per-frame prediction noise added in px^2.
  process_noise_variance: 1.0
  allowed_BER_per_seq: 1
  manchester_code: false
  # If set, sequence_file replaces the inline library below. All loaded
  # sequences must be non-empty and have equal length.
  sequence_file: ""
  sequences:
    - "111001011"
    - "110011010"
    - "101100111"
    - "100111010"
  inputs:
    - name: camera_0
      input_topic: /detector/camera_0/points_seen
      input_image_topic: /my_camera/pylon_ros2_camera_node/image_raw
      output_topic: /tracker/camera_0/blinkers
      publish_visualization: true
      visualization_topic: /tracker/camera_0/visualization

pose_estimation:
  implementation: pnp

filtering:
  implementation: unscented

calibration:
  implementation: ocamcalib

simulation:
  implementation: default
