# do not modify these
root: ./
name: mrs_pcl_tools
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window:
  - export UAV_NAME=uav1
  - export RMW_IMPLEMENTATION=rmw_zenoh_cpp
startup_window: status
windows:
  - zenoh_router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - foxglove:
      layout: tiled
      panes:
        - ros2 launch foxglove_bridge foxglove_bridge_launch.xml 
        - ros2 bag play /home/mrs/ros2_ws/bags/led_rosbag --rate 0.5
  - uvled_detector:
      layout: tiled
      panes:
        - ros2 launch uvdar_ros_wrapper uv_led_detector.launch.py