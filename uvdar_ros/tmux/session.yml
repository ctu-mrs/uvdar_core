# do not modify these
root: ./
name: mrs_pcl_tools
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window:
  - export UAV_NAME=uav1
  - export RMW_IMPLEMENTATION=rmw_zenoh_cpp
startup_window: status
windows:
  - zenoh_router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - foxglove:
      layout: tiled
      panes:
        - ros2 launch foxglove_bridge foxglove_bridge_launch.xml 
        # - ros2 launch pylon_ros2_camera_wrapper pylon_ros2_camera.launch.py
        # - ros2 bag play /home/tomas/ros2_ws/bags/two_uv_markers --rate 0.5
        - ros2 bag play /home/tomas/ros2_ws/bags/one_uv_marker --rate 0.5
  - uvdar::
      layout: tiled
      panes:
        # - ros2 launch uvdar_ros uvdar.launch.py
        - ros2 launch uvdar_ros uv_led_detector.launch.py
        - ros2 launch uvdar_ros blink_processor.launch.py